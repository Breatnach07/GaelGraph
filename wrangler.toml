name = "gaelgraph"
main = "src/worker.js"
compatibility_date = "2026-10-15"
workers_dev = true
preview_urls = true
routes = [{ pattern = "gaelgraph.com/*", zone_name = "gaelgraph.com" }]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"



[triggers]
crons = ["5 0 * * *"]
