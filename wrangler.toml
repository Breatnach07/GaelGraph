name = "gaelgraph"
main = "src/worker.js"
compatibility_date = "2026-10-15"
workers_dev = true
preview_urls = true
routes = [
  { pattern = "gaelgraph.com/*", zone_name = "gaelgraph.com" },
  { pattern = "www.gaelgraph.com/*", zone_name = "gaelgraph.com" },
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true



[triggers]
crons = ["5 0 * * *"]
