<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12372d">
  <title>Leaderboards — Gaeilge Daily</title>
  <link rel="stylesheet" href="/assets/css/site.css">
  <script src="/assets/js/app.js" defer></script>
</head>
<body data-protected="true">
  <header class="shell site-header">
    <a class="brand" href="/"><span class="brand-mark">G</span> Gaeilge Daily</a>
    <nav class="nav" aria-label="Main navigation"><a href="/leaderboard/" aria-current="page">Leaderboard</a><a href="/friends/">Friends</a><button class="icon-button" data-settings aria-label="Settings">⚙</button></nav>
  </header>
  <main class="shell app-content" data-authenticated hidden>
    <div class="page-heading"><p class="eyebrow">Friendly competition</p><h1>Leaderboards</h1><p>See who's showing up for Irish today.</p></div>
    <div class="controls">
      <div class="segmented" aria-label="Leaderboard scope"><button data-scope="global" aria-pressed="true">Global</button><button data-scope="local" aria-pressed="false">My region</button></div>
      <div class="segmented" aria-label="Leaderboard timeframe"><button data-period="daily" aria-pressed="true">Daily</button><button data-period="weekly" aria-pressed="false">Weekly</button></div>
    </div>
    <p class="status" id="leaderboard-status" role="status"></p>
    <section id="leaderboard-list" class="leaderboard panel" aria-live="polite"><div class="loading">Sign in to view the leaderboard.</div></section>
  </main>
  <p class="shell status" data-page-status role="status"></p>
  <footer class="shell site-footer">Keep learning. Keep climbing.</footer>
  <div class="modal-backdrop" id="region-modal" hidden><section class="modal panel" role="dialog" aria-modal="true" aria-labelledby="region-title"><p class="eyebrow">Your profile</p><h2 id="region-title">Update your region</h2><form id="region-form"><label class="form-field">Region<select name="regionType"><option value="ireland">Ireland</option><option value="international">International</option></select></label><label class="form-field">County or area<select name="regionName"></select></label><p class="status" role="status"></p><button class="button full" type="submit">Save region</button><button class="button subtle full" style="margin-top:9px" type="button" data-close-region>Cancel</button></form></section></div>
</body>
</html>
